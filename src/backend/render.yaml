# Render blueprint: deploy this backend as a public FastAPI service.
#
# One-click deploy (open while logged into Render):
#   https://render.com/deploy?repo=https://github.com/Falcons-FZU-MU-SE-GROUP12/SportsBuddy
#
# This monorepo keeps the backend under src/backend/, so rootDir must point
# there — otherwise Render cannot find requirements.txt or main.py.
services:
  - type: web
    name: sportmate-backend
    runtime: python
    rootDir: src/backend
    plan: free
    region: singapore # Asian node (faster from China); oregon / frankfurt / ohio also work
    branch: main
    buildCommand: pip install -r requirements.txt
    # Render injects the public port as $PORT; never hardcode 8000.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.5'
      # NOTE: the free instance has no persistent disk, so a redeploy or restart
      # resets the SQLite data. For the demo/acceptance window this is fine as
      # long as the instance is not redeployed. For permanent storage, upgrade to
      # a paid plan and enable the disk block below, then switch the database URL
      # to sqlite:////var/data/sportmate.db (four slashes = absolute path).
      - key: SPORTMATE_DATABASE_URL
        value: sqlite:///./data/sportmate.db
      - key: SPORTMATE_TOKEN_TTL_DAYS
        value: '30'
    # disk:
    #   name: sportmate-data
    #   mountPath: /var/data
    #   sizeGB: 1
